    - setCodeId
    - kin
    - componentCis
    properties:
      unitId:
        type: string
        format: uuid
      setCodeId:
        type: string
        format: uuid
      kin:
        type: string
        pattern: ^[A-Z0-9-]{8,80}$
        description: Код стенда в учебном формате.
      componentCis:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: string
          pattern: ^[A-Z0-9-]{8,80}$
          description: Код стенда в учебном формате.
        uniqueItems: true
  Requirement:
    type: object
    additionalProperties: false
    required:
    - sku
    - quantity
    properties:
      sku:
        type: string
        enum:
        - COMP-001
      quantity:
        type: integer
        minimum: 2
        maximum: 100
